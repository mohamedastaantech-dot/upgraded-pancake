<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Astaan HR Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed left rail of sections (top scroller on phones), working area on the right; Astaan orange used only for actions and the active state. */
:root{
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#eef0f4; --line:#dde1e8;
  --fg:#18202d; --muted:#5d6878; --accent:#e04a00; --accent-ink:#ffffff; --accent-soft:#ffe9dd;
  --ok:#11845b; --ok-soft:#dcf3e9; --warn:#a85f00; --warn-soft:#fdf0d8; --bad:#c22f3a; --bad-soft:#fbe2e4; --info:#2c5fc9; --info-soft:#e2eafb;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1118; --panel:#161c26; --panel-2:#1d2430; --line:#2a3342;
  --fg:#e9edf3; --muted:#97a2b3; --accent:#ff6a1f; --accent-ink:#1a0c03; --accent-soft:#3a1d0e;
  --ok:#3ccf8e; --ok-soft:#123326; --warn:#f2b247; --warn-soft:#3a2a10; --bad:#ff6b75; --bad-soft:#3d1a1e; --info:#7ea6ff; --info-soft:#18264a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1118; --panel:#161c26; --panel-2:#1d2430; --line:#2a3342;
  --fg:#e9edf3; --muted:#97a2b3; --accent:#ff6a1f; --accent-ink:#1a0c03; --accent-soft:#3a1d0e;
  --ok:#3ccf8e; --ok-soft:#123326; --warn:#f2b247; --warn-soft:#3a2a10; --bad:#ff6b75; --bad-soft:#3d1a1e; --info:#7ea6ff; --info-soft:#18264a;
  color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;font-size:14px}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-block:10px;padding-inline:clamp(16px,3vw,36px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.me{position:relative}
.me>button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.me>button:hover{border-color:var(--accent)}
.me>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;letter-spacing:.02em;object-fit:cover}
.me .nm{display:flex;flex-direction:column;line-height:1.2;text-align:left;min-width:0}
.me .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.me .nm small{font-size:11px;color:var(--accent);font-weight:700}
.me .caret{color:var(--muted);font-size:11px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);min-width:210px;padding:6px;display:flex;flex-direction:column;z-index:30}
.menu .mh{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .mh small{color:var(--muted);font-size:12px;display:block}
.menu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft);color:var(--accent)}
.menu button small{color:var(--muted);font-weight:500}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{display:block;font-size:15px;letter-spacing:.08em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.who{background:var(--panel-2);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:center;min-width:0}
.who img{width:32px;height:32px;border-radius:50%;flex:none}
.who div{min-width:0}
.who strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11px;color:var(--accent);font-weight:700}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
nav button:hover{background:var(--panel-2);color:var(--fg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{background:var(--accent);color:var(--accent-ink);font-size:11px;border-radius:99px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px}
.seg{display:flex;background:var(--panel-2);border-radius:8px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:5px 6px;border-radius:6px;font-weight:700;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
main{padding-block:22px 48px;padding-inline:clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.preview{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:6px 8px}
.preview select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-weight:700;color:var(--fg)}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.tile .val{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .val.sm{font-size:17px}
.tile .note{font-size:12px;color:var(--muted);margin-top:4px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12px}
.bar .track{height:12px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.item:hover{border-color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent)}
.item b{font-size:13px;display:block}
.item small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--panel-2);color:var(--muted)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input:focus,.toolbar select:focus,.field :is(input,select,textarea):focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--panel-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.banner.info{background:var(--info-soft);border-color:transparent}
.bal .meter{height:8px;background:var(--panel-2);border-radius:4px;margin-top:10px;overflow:hidden}
.bal .meter i{display:block;height:100%;background:var(--accent)}
.hol{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hol:first-of-type{border-top:0}
.cal{width:52px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--panel-2)}
.cal b{display:block;font-size:18px;line-height:1.1}
.cal small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.hol .t{flex:1;min-width:0}
.hol .t b{display:block;font-size:13px}
.hol .t small{color:var(--muted);font-size:12px}
.past{opacity:.55}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog .x{all:unset;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.dialog .x:focus-visible{outline:2px solid var(--accent)}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad);font-weight:600}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.trail{display:flex;flex-direction:column;gap:6px;font-size:12px}
.trail div{display:flex;gap:8px;align-items:baseline}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.people{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.people button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px}
.people button:hover,.people button[aria-pressed="true"]{background:var(--accent-soft)}
.people img{width:24px;height:24px;border-radius:50%}
@media (max-width:900px){
  .two{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:column;gap:10px;padding:12px 16px;z-index:20;border-right:0;border-bottom:1px solid var(--line)}
  .side-foot{display:none}
  .topbar{position:static}
  .me .nm b{max-width:140px}
  .brand{justify-content:space-between}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav button{white-space:nowrap}
  .mob-tools{display:flex!important}
  .bar{grid-template-columns:96px minmax(0,1fr) 40px}
  form.f{grid-template-columns:1fr}
}
.mob-tools{display:none;gap:6px}
.logo{width:38px;height:38px;object-fit:contain;flex:none}

function ledgerRows(e){
  const ls=LS(), h=parseYmd(hireOf(e)), Y=new Date().getFullYear(), rows=[]; let run=Number(e.adjust)||0;
  const taken=approvedOf(e,"annual");
  for(let y=Math.max(FOUNDED,h.getFullYear()); y<=Y; y++){
    const add = y===h.getFullYear() ? Math.round(ls.annual*(12-h.getMonth())/12*10)/10 : ls.annual;
    const tk = taken.filter(l=>String(l.start).slice(0,4)===String(y)).reduce((s,l)=>s+(l.days||0),0);

function hijri(d){ if(!HF) return null; const o={}; HF.formatToParts(d).forEach(p=>{ if(p.type==="month") o.m=parseInt(p.value,10); if(p.type==="day") o.d=parseInt(p.value,10); }); return o; }

const HCACHE = {};
function holidays(Y){
  if (HCACHE[Y]) return HCACHE[Y];
  const out = FIXED.map(h=>({...h, start:ymd(new Date(Y,h.m-1,h.d)), isl:false}));
  if (HF){ for (let d=new Date(Y,0,1); d.getFullYear()===Y; d.setDate(d.getDate()+1)){ const h=hijri(d); if(!h) continue; ISL.forEach(x=>{ if(x.m===h.m && x.d===h.d) out.push({...x,start:ymd(d),isl:true}); }); } }
  out.sort((a,b)=>a.start<b.start?-1:1); HCACHE[Y]=out; return out;
}
function holidaySet(Y){ const s=new Set(); holidays(Y).forEach(h=>{ const d=parseYmd(h.start); for(let i=0;i<h.days;i++){ s.add(ymd(d)); d.setDate(d.getDate()+1);} }); return s; }
function countDays(a,b){
  if(!a||!b) return 0; const s=parseYmd(a), e=parseYmd(b); if (e<s) return -1;
  const sets={}; let n=0;
  for(const d=new Date(s); d<=e; d.setDate(d.getDate()+1)){ const Y=d.getFullYear(); sets[Y]=sets[Y]||holidaySet(Y); if(d.getDay()===5) continue; if(sets[Y].has(ymd(d))) continue; n++; }
  return n;
}

/* every request walks the chain: department director -> HR -> (Finance for advances) -> General Manager.

function stageOK(x, stage){
  const r=role(), ar=applicantRole(x.empId);
  if (stage==="dept") return DIRS[r]===recDept(x) || (r==="GM" && !deptHasDirector(recDept(x)));
  if (stage==="hr") return r==="HR" || (r==="GM" && ar==="HR");
  if (stage==="fin") return r==="FIN" || (r==="GM" && ar==="FIN");
  if (stage==="gm") return r==="GM";
  return false;
}

/* names */
function nameOf(id){ return S.names[id] || ""; }
async function needNames(ids){
  if(!S.user) return; const miss=[...new Set(ids.filter(Boolean))].filter(i=>!S.namesReq.has(i)); if(!miss.length) return;
  miss.forEach(i=>S.namesReq.add(i));
  try{ const ps = await S.user.profiles(miss); let ch=false; for(const k in ps){ if(ps[k].name && S.names[k]!==ps[k].name){ S.names[k]=ps[k].name; ch=true; } if(ps[k].avatarUrl && S.avatars[k]!==ps[k].avatarUrl){ S.avatars[k]=ps[k].avatarUrl; ch=true; } } if(ch) render(); }catch(e){}
}

/* ============ writes ============ */
function toast(msg){ const r=document.getElementById("toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.h); toast.h=setTimeout(()=>{ r.innerHTML=""; },3200); }
async function write(fn, okMsg){
  if (!S.db){ toast(t("signedOut")); return false; }
  try { await fn(S.db); if (okMsg) toast(okMsg); return true; }
  catch(e){ const c=e&&e.code; if (c==="invalid_argument"){ S.canWrite=false; toast(t("errWrite")); render(); } else if (c==="unavailable"){ try{ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await fn(S.db); if(okMsg) toast(okMsg); return true; }catch(e2){ toast(t("errGeneric")); } } else toast(t("errGeneric")); return false; }
}
const nowIso = () => new Date().toISOString();
const newRef = p => p+"-"+Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,4).toUpperCase();
const trailEntry = (action, from, extra) => ({action, from, by:S.uid||null, role:role(), at:nowIso(), ...(extra||{})});

async function decideLeave(id, approve, note){
  const l=S.leaves.find(x=>x.id===id); if(!l||!canActLeave(l)) return;
  let next = "rejected";
  if (approve) next = "approved";
  const trail=[...(l.trail||[]), trailEntry(approve?"approve":"reject", l.status, note?{note}:{})];
  const ok = await write(db=>db.doc("leaves/"+id).update({status:next, trail}), t("done"));
  closeModal();
}
async function decideAdv(id, approve, note){
  const a=S.advances.find(x=>x.id===id); if(!a||!canActAdv(a)) return;
  const next = !approve ? "rejected" : ({dept:"hr",hr:"fin",fin:"gm",gm:"active"})[a.status];
  const trail=[...(a.trail||[]), trailEntry(approve?"approve":"reject", a.status, note?{note}:{})];
  await write(db=>db.doc("advances/"+id).update({status:next, trail}), t("done")); closeModal();
}
async function deductAdv(id){
  const a=S.advances.find(x=>x.id===id); if(!a||!canDeduct(a)) return;
  const amt=Math.min(a.monthly, a.amount-(a.paid||0)); const paid=(a.paid||0)+amt;
  const trail=[...(a.trail||[]), trailEntry("deduct","active",{amount:amt})];
  await write(db=>db.doc("advances/"+id).update({paid, status: paid>=a.amount?"repaid":"active", trail}), t("done")); closeModal();
}

function reportData(){
  const f=S.f, Y=new Date().getFullYear(); const from=f.rfrom||Y+"-01-01", to=f.rto||Y+"-12-31";
  const dOk = d => !f.rdept || f.rdept==="all" || d===f.rdept;
  if (f.rcat==="leave"){
    const rows=S.leaves.filter(l=>dOk(l.dept) && l.start<=to && l.end>=from).sort((a,b)=>a.start.localeCompare(b.start));
    return {from,to,head:[t("ref"),t("employee"),t("dept"),t("type"),t("start"),t("end"),t("days"),t("status")], num:[6],
      rows:rows.map(l=>[l.id,l.name,dn(l.dept),t("lt_"+l.type),l.start,l.end,l.days,t("s_"+l.status)]),
      summary:[[t("records",rows.length),""],[t("totalDays"),rows.filter(l=>l.status==="approved").reduce((s,l)=>s+l.days,0)+" ("+t("s_approved")+")"]]};
  }
  if (f.rcat==="adv"){
    const rows=S.advances.filter(a=>dOk(a.dept) && (a.createdAt||"").slice(0,10)>=from && (a.createdAt||"").slice(0,10)<=to);
    return {from,to,head:[t("ref"),t("employee"),t("dept"),t("amount"),t("monthly"),t("paid"),t("status")], num:[3,4,5],
      rows:rows.map(a=>[a.id,a.name,dn(a.dept),a.amount,a.monthly,a.paid||0,t("s_"+a.status)]),
      summary:[[t("records",rows.length),""],[t("outstanding"),money(rows.filter(a=>["active"].includes(a.status)).reduce((s,a)=>s+a.amount-(a.paid||0),0))]]};
  }
  const ds=DEPTS.filter(dOk); const rows=ds.map(d=>{ const es=S.employees.filter(e=>e.dept===d); const ad=S.advances.filter(a=>a.dept===d && a.status==="active").reduce((s,a)=>s+a.amount-(a.paid||0),0); return [dn(d), es.length, es.length?(es.reduce((s,e)=>s+balanceOf(e,"annual"),0)/es.length).toFixed(1):"–", ad]; });
  return {from,to,head:[t("dept"),t("headcount"),t("avgBal"),t("outstanding")], num:[1,2,3], rows,
    summary:[[t("headcount"),rows.reduce((s,r)=>s+r[1],0)],[t("outstanding"),money(rows.reduce((s,r)=>s+r[3],0))]]};
}

  ${act?`<div class="field"><label for="dNote">${esc(t("rejectNote"))}</label><textarea id="dNote" rows="2"></textarea></div><div class="row" style="justify-content:flex-end"><button class="btn bad" data-act="rejectAdv" data-id="${esc(a.id)}">${esc(t("reject"))}</button><button class="btn ok" data-act="approveAdvM" data-id="${esc(a.id)}">${esc(t("approve"))}</button></div>`:""}
  ${dd?`<div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="deduct" data-id="${esc(a.id)}">${esc(t("recordDeduct"))} (${money(Math.min(a.monthly,a.amount-(a.paid||0)))})</button></div>`:""}`);
}
function chooseList(){ const r=role(), me=myEmp(); if(["HR","SA","GM"].includes(r)) return S.employees; if(DIRS[r]) return S.employees.filter(e=>e.dept===DIRS[r] || (me&&e.id===me.id)); return null; }

function newLeave(){

    const ok=await write(db=>db.doc("leaves/"+id).set({empId:e.id,name:e.name,dept,type:v.type,start:v.s,end:v.e,days:v.days,reason,status,by:S.uid||null,createdAt:nowIso(),trail}), t("sentLeave"));

function validateLeave(){
  const empId=(document.getElementById("fEmp")||{}).value, emp=empById(empId), type=document.getElementById("fType").value, s=document.getElementById("fStart").value, e=document.getElementById("fEnd").value;
  if(!emp) return {err:t("notLinked")};
  const days=countDays(s,e); if(days<0) return {err:t("errDates")}; if(days===0) return {err:t("errNoDays"), days:0};
  if (BAL_TYPES[type]){ const left=Math.round((balanceOf(emp,type)-pendingOf(emp,type))*10)/10; if(days>left) return {err:t("errBalance",left),days,left}; return {emp,type,s,e,days,left}; }
  return {emp,type,s,e,days};
}

/* ============ boot (Supabase) ============ */
function mkDb(sb){
  const split=p=>{ const a=p.split("/"); return {table:a[0], id:a.slice(1).join("/")}; };
  const fail=(error)=>{ const e=new Error(error.message||"error"); e.code=(error.code==="42501"||/row-level security|permission|violates/i.test(error.message||""))?"invalid_argument":"unavailable"; throw e; };
  const denied=()=>{ const e=new Error("not allowed"); e.code="invalid_argument"; throw e; };
  const merge=(a,b)=>{ const o={...(a||{})}; for(const k in b){ const v=b[k]; if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])) o[k]=merge(o[k],v); else o[k]=v; } return o; };
  const L={}, CH={}, TM={};
  const refresh=tb=>{ clearTimeout(TM[tb]); TM[tb]=setTimeout(()=>(L[tb]||[]).forEach(f=>f()),120); };
  const listen=(tb,fn)=>{ (L[tb]=L[tb]||new Set()).add(fn); if(!CH[tb]) CH[tb]=sb.channel("rt-"+tb).on("postgres_changes",{event:"*",schema:"public",table:tb},()=>refresh(tb)).subscribe(); };
  setInterval(()=>Object.keys(L).forEach(refresh), 60000);
  async function readAll(tb){ let out=[], from=0; for(;;){ const {data,error}=await sb.from(tb).select("id,data").range(from,from+999); if(error) fail(error); out=out.concat(data); if(data.length<1000) break; from+=1000; } return out; }
  return {
    doc(path){ const {table,id}=split(path); const ref={
      async get(){ const {data,error}=await sb.from(table).select("data").eq("id",id).maybeSingle(); if(error) fail(error); return {id,exists:!!data,data:()=>data?data.data:undefined}; },
      async set(d){ const {data,error}=await sb.from(table).upsert({id,data:d}).select("id"); if(error) fail(error); if(!data||!data.length) denied(); refresh(table); },
      async update(d){ const cur=await ref.get(); if(!cur.exists) denied(); const {data,error}=await sb.from(table).update({data:merge(cur.data(),d)}).eq("id",id).select("id"); if(error) fail(error); if(!data||!data.length) denied(); refresh(table); },
      async delete(){ const {data,error}=await sb.from(table).delete().eq("id",id).select("id"); if(error) fail(error); if(!data||!data.length) denied(); refresh(table); },
      onSnapshot(next){ const run=async()=>{ try{ next(await ref.get()); }catch(e){} }; run(); listen(table,run); return ()=>{}; } }; return ref; },
    collection(table){ return { onSnapshot(next){ const run=async()=>{ try{ const rows=await readAll(table); next({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data}))}); }catch(e){} }; run(); listen(table,run); return ()=>{}; } }; }
  };
}
async function boot(){
  render();
  const C=window.ASTAAN_CONFIG||{};
  if(!window.supabase || !C.SUPABASE_URL || /YOUR|xxxx/i.test(C.SUPABASE_URL) || !C.SUPABASE_ANON_KEY){ S.mode="noconfig"; render(); return; }
  SB=supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  SB.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY"){ S.mode="recovery"; render(); } });
  if(/type=recovery/.test(location.hash)){ S.mode="recovery"; render(); return; }
  const {data:{session}}=await SB.auth.getSession();
  if(S.mode==="recovery") return;
  if(!session){ S.mode="login"; render(); return; }
  start(session.user);
}
function start(u){
  if(S.started) return; S.started=true;
  S.uid=u.id; S.mode="loading"; ME={email:u.email, name:(u.user_metadata&&u.user_metadata.name)||"", avatarUrl:""};
  const db=S.db=mkDb(SB); render();
  const need=["employees","leaves","advances","roles","users"];
  (async()=>{ try{ const ref=db.doc("users/"+S.uid), g=await ref.get(); const now=nowIso();
    if(!g.exists) await ref.set({email:u.email,name:ME.name,firstSeen:now,lastSeen:now}); else if(Date.now()-Date.parse((g.data()||{}).lastSeen||0)>15*60*1000) await ref.update({lastSeen:now}); }catch(e){} })();
  db.doc("settings/leave").onSnapshot(d=>{ S.settings=d.exists?d.data():null; render(); });
  need.forEach(c=>{ db.collection(c).onSnapshot(snap=>{
    S[c]=snap.docs.map(d=>{ const o={id:d.id,...d.data()}; if(o.dept&&DEPT_ALIAS[o.dept]) o.dept=DEPT_ALIAS[o.dept]; return o; });
    if(c==="roles"){ const me=S.roles.find(r=>r.id===S.uid); S.canEdit=!!(me&&me.role==="SA"); }
    if(c==="users"){ S.users.forEach(x=>{ S.names[x.id]=x.name||x.email||""; }); const me=S.users.find(x=>x.id===S.uid); if(me&&me.name) ME.name=me.name; }
    S.loaded[c]=true; if(need.every(x=>S.loaded[x])) S.mode="ready"; render(); }); });
}
boot();
